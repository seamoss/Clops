name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  validate:
    name: Test and universal Release
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Clops.xcodeproj \
            -scheme Clops \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/ClopsTests" \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze MAS-configured Release
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project Clops.xcodeproj \
            -scheme Clops \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ClopsAnalyze" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build MAS-configured universal Release
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Clops.xcodeproj \
            -scheme Clops \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ClopsRelease" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

          binary="$RUNNER_TEMP/ClopsRelease/Build/Products/Release/Clops.app/Contents/MacOS/Clops"
          architectures="$(lipo -archs "$binary")"
          architecture_count="$(wc -w <<< "$architectures" | tr -d ' ')"

          [[ "$architecture_count" == "2" ]]
          grep -qx 'arm64' <<< "$(tr ' ' '\n' <<< "$architectures")"
          grep -qx 'x86_64' <<< "$(tr ' ' '\n' <<< "$architectures")"
